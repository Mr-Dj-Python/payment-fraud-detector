[project]
name = "payment-fraud-detector"
version = "0.1.0"
description = "Real-time mule-network / fraud-ring interception — Phase 0 simulation"
authors = [
    { name = "Mr-Dj-Python", email = "dvishwakarma@ablegroup.io" }
]
requires-python = ">=3.15"
dependencies = [
    "babel>=2.18.0",
]

[project.scripts]
payment-fraud-detector = "payment_fraud_detector.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
